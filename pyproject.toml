[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "idea-graph-shell"
version = "0.2.0"
description = "Оболочка «Графа идеи»: шаги слева, граф справа, банк знаний, настройки"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "idea-graph-core @ git+https://github.com/senia-glitch/idea-graph-core.git",
    "idea-graph-engine @ git+https://github.com/senia-glitch/idea-graph-composer.git",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
idea-graph = "idea_graph_shell.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
idea_graph_shell = ["static/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
